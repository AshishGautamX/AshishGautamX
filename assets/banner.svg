<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1124" />
      <stop offset="100%" stop-color="#070c1b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Line Gradient -->
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Overlay -->
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Abstract Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="160" fill="#6366f1" opacity="0.09" filter="url(#glow)" />

  <!-- Accent Border Top Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanIndigo)" rx="2" />

  <!-- Tech Accent Geometric Accents (Right Side) -->
  <g opacity="0.4">
    <circle cx="1020" cy="140" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 8" />
    <circle cx="1020" cy="140" r="100" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="1020" cy="140" r="130" fill="none" stroke="#334155" stroke-width="0.8" />
    <line x1="880" y1="140" x2="1160" y2="140" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" />
    <line x1="1020" y1="0" x2="1020" y2="280" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" />
  </g>

  <!-- Content Group -->
  <g transform="translate(90, 85)">
    <!-- Terminal Tag / Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">PORTFOLIO &amp; SYSTEMS</text>
    </g>

    <!-- Name / Main Title -->
    <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Ashish Gautam
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="118" fill="url(#cyanIndigo)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      AI &amp; Systems Engineer
    </text>

    <!-- Divider Line -->
    <rect x="0" y="142" width="540" height="1.5" fill="url(#lineGlow)" />

    <!-- Core Domains Tagline -->
    <text x="0" y="172" fill="#64748b" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="500" letter-spacing="0.5">
      Low-Latency Inference // Transformer Models // Scalable Distributed Systems
    </text>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#1e293b" stroke-width="1.2" rx="15" />
</svg>
